# Include from nginx's http context, for example sites-enabled/tripreel.
log_format tripreel '$remote_addr - $time_local "$request_method $uri $server_protocol" $status $body_bytes_sent';
limit_req_zone $binary_remote_addr zone=tripreel_api:1m rate=5r/s;

server {
    listen 80;
    listen [::]:80;
    server_name tripreel.xinyang20.cn;
    access_log /var/log/nginx/tripreel.access.log tripreel;
    error_log /var/log/nginx/tripreel.error.log warn;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/tripreel-acme;
        default_type text/plain;
        add_header Cache-Control "no-store" always;
        try_files $uri =404;
    }

    location / {
        return 308 https://tripreel.xinyang20.cn$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name tripreel.xinyang20.cn;
    ssl_certificate /etc/letsencrypt/live/tripreel.xinyang20.cn/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/tripreel.xinyang20.cn/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;
    access_log /var/log/nginx/tripreel.access.log tripreel;
    error_log /var/log/nginx/tripreel.error.log warn;
    server_tokens off;
    client_max_body_size 32k;
    proxy_hide_header X-Content-Type-Options;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/tripreel-acme;
        default_type text/plain;
        add_header Cache-Control "no-store" always;
        try_files $uri =404;
    }

    location /api/ {
        limit_req zone=tripreel_api burst=20 nodelay;
        limit_req_status 429;
        access_log off;
        proxy_pass http://127.0.0.1:4173;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_connect_timeout 5s;
        proxy_read_timeout 90s;
        proxy_send_timeout 30s;
        proxy_buffering off;
        proxy_cache off;
        proxy_hide_header Cache-Control;
        proxy_hide_header X-Content-Type-Options;
        add_header Cache-Control "no-store" always;
        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options SAMEORIGIN always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;
    }

    location / {
        proxy_pass http://127.0.0.1:4173;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_connect_timeout 5s;
        proxy_read_timeout 30s;
    }
}
